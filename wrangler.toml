name = "cents-monitor"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
# 1) checagem a cada minuto  2) conferência às 9h, 15h e 21h de Brasília (12, 18 e 00 UTC)
crons = ["* * * * *", "0 0,12,18 * * *"]

[observability]
enabled = true

# Segredos (wrangler secret put): NTFY_TOPIC, NTFY_TOKEN, ALERT_EMAIL, ADMIN_KEY

# criado com: npx wrangler kv namespace create STATE
[[kv_namespaces]]
binding = "STATE"
id = "77d68e073907449e8c6967e9d095b0e6"
